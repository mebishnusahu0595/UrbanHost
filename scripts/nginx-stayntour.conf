server {
    server_name stayntour.com www.stayntour.com admin.stayntour.com superadmin.stayntour.com partner.stayntour.com listproperty.stayntour.com;

    client_max_body_size 100M;

    # Aggressive Gzip Compression for Instant Transfers
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        image/svg+xml;

    # Nginx Edge Serving for BnB Images (Instant 0-1ms cache)
    location /bnb-images/ {
        alias /var/www/stayntour/public/bnb-images/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
        tcp_nodelay on;
        try_files $uri =404;
    }

    # High performance static uploads
    location /uploads/ {
        alias /var/www/stayntour/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Next.js Static Chunks & Build Artifacts
    location /_next/static/ {
        alias /var/www/stayntour/.next/static/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Root Static Assets (Hero images, logos, icons, favicon)
    location ~* ^/(hero\.webp|hero\.png|hero-mobile\.webp|logo_name\.png|icon\.png|favicon\.ico|manifest\.webmanifest|robots\.txt|sitemap\.xml)$ {
        root /var/www/stayntour/public;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri @nextjs;
    }

    location @nextjs {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dynamic Application Requests
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/stayntour.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stayntour.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = listproperty.stayntour.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = partner.stayntour.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = superadmin.stayntour.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = admin.stayntour.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = www.stayntour.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = stayntour.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name stayntour.com www.stayntour.com admin.stayntour.com superadmin.stayntour.com partner.stayntour.com listproperty.stayntour.com;
    return 404;
}
